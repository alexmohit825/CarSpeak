name: CarSpeak Ad-Hoc Direct IPA Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Target Bundle ID for Ad-Hoc Delivery'
        required: false
        default: 'com.AlexMohit.CarSpeak'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-export:
    name: 🍏 Compile, Sign & Export CarSpeak Ad-Hoc IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode (iOS SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app || sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version
          xcrun simctl list > /dev/null || true

      - name: ⚙️ Install XcodeGen
        run: brew install xcodegen

      - name: 🏗️ Generate Native Xcode Project with Dynamic Build Number
        run: |
          BUILD_NUM=$(( ${{ github.run_number }} + 10 ))
          TARGET_BUNDLE="${{ github.event.inputs.bundle_id || 'com.AlexMohit.CarSpeak' }}"
          echo "Setting CURRENT_PROJECT_VERSION to $BUILD_NUM and PRODUCT_BUNDLE_IDENTIFIER to $TARGET_BUNDLE"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: .*/PRODUCT_BUNDLE_IDENTIFIER: $TARGET_BUNDLE/" project.yml
          xcodegen generate

      - name: 🔑 Configure App Store Connect API Credentials
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: 🚀 Compile & Export Ad-Hoc IPA (iPhone + Siri Voice Relay)
        run: |
          mkdir -p build/archive build/output
          xcodebuild archive \
            -project CarSpeak.xcodeproj \
            -scheme CarSpeak \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/archive/CarSpeak.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          cat > build/archive_entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>523MJL63MC.com.AlexMohit.CarSpeak</string>
              <key>com.apple.developer.team-identifier</key>
              <string>523MJL63MC</string>
          </dict>
          </plist>
          EOF

          codesign --force --sign - --entitlements build/archive_entitlements.plist build/archive/CarSpeak.xcarchive/Products/Applications/CarSpeak.app
          echo "🔎 Verifying Embedded Archive Entitlements:"
          codesign -d --entitlements :- build/archive/CarSpeak.xcarchive/Products/Applications/CarSpeak.app

          xcodebuild -exportArchive \
            -archivePath build/archive/CarSpeak.xcarchive \
            -exportOptionsPlist ExportOptions-AdHoc.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

          ls -la build/output
          echo "✅ Exported CarSpeak.ipa Ad-Hoc build successfully!"

      - name: 📦 Upload CarSpeak Ad-Hoc IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarSpeak-AdHoc-IPA
          path: build/output/CarSpeak.ipa
          retention-days: 14
