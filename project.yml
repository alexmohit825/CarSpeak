name: CarSpeak
options:
  bundleIdPrefix: com.AlexMohit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: CarSpeak
    PRODUCT_BUNDLE_IDENTIFIER: com.AlexMohit.CarSpeak
    DEVELOPMENT_TEAM: "523MJL63MC"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    INFOPLIST_FILE: CarSpeak/Info.plist
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    SDKROOT: iphoneos

targets:
  CarSpeak:
    type: application
    platform: iOS
    sources:
      - path: CarSpeak
        excludes:
          - "**/*.entitlements"
    resources:
      - path: CarSpeak/Models/AGPortfolioSeed.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.AlexMohit.CarSpeak
        PRODUCT_NAME: CarSpeak
        INFOPLIST_FILE: CarSpeak/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
