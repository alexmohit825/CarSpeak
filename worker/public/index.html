<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CarSpeak — Hands-Free AI</title>
  <style>
    :root {
      --bg-top: #f7faff;
      --bg-mid: #eef4ff;
      --bg-bot: #fff8f1;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --indigo: #4f46e5;
      --sky: #0ea5e9;
      --violet: #8b5cf6;
      --emerald: #10b981;
      --coral: #f97316;
      --rose: #f43f5e;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      background: linear-gradient(145deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bot) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .shell {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      padding: 14px 18px;
      border-radius: 20px;
      border: 1px solid rgba(79, 70, 229, 0.12);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffffff, #f1f5f9);
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.06);
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--indigo), var(--sky));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      color: #047857;
      background: #d1fae5;
      padding: 6px 12px;
      border-radius: 999px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
    }
    .dropdown-card {
      background: var(--card);
      border-radius: 20px;
      padding: 16px 18px;
      border: 1px solid rgba(14, 165, 233, 0.18);
      box-shadow: 0 10px 28px rgba(14, 165, 233, 0.06);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--indigo);
    }
    select {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text);
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    select:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    .orb-card {
      background: var(--card);
      border-radius: 28px;
      padding: 36px 24px;
      border: 1px solid rgba(139, 92, 246, 0.16);
      box-shadow: 0 14px 36px rgba(79, 70, 229, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }
    .voice-orb {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--indigo) 0%, var(--sky) 55%, var(--violet) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 16px 38px rgba(14, 165, 233, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      color: #ffffff;
      user-select: none;
    }
    .voice-orb:hover {
      transform: scale(1.03);
    }
    .voice-orb.listening {
      background: linear-gradient(135deg, var(--emerald) 0%, var(--sky) 55%, var(--indigo) 100%);
      box-shadow: 0 16px 44px rgba(16, 185, 129, 0.45);
      animation: pulse 1.4s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    .orb-caption {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .orb-sub {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pill-btn {
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .pill-btn:active { transform: scale(0.97); }
    .btn-coral { background: #ffedd5; color: #c2410c; }
    .btn-indigo { background: #e0e7ff; color: #3730a3; }
    .btn-rose { background: #ffe4e6; color: #be123c; }

    .response-card {
      background: var(--card);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.04);
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .response-card.visible {
      display: flex;
    }
    .turn-user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--indigo), var(--sky));
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      max-width: 88%;
    }
    .turn-model {
      align-self: flex-start;
      background: #f1f5f9;
      color: var(--text);
      padding: 12px 15px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.45;
      max-width: 92%;
    }
    .composer {
      display: flex;
      gap: 8px;
      background: var(--card);
      padding: 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }
    .composer input {
      flex: 1;
      border: none;
      outline: none;
      padding: 8px 10px;
      font-size: 0.92rem;
      color: var(--text);
      background: transparent;
    }
    .send-btn {
      background: linear-gradient(135deg, var(--indigo), var(--sky));
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 100 100" fill="none">
            <path d="M22 84 C26 74, 26 65, 23 58 C16 48, 15 34, 22 24 C29 14, 44 12, 54 18 C59 22, 61 29, 59 35 L65 46 C66 49, 62 51, 59 52 L61 55 C56 57, 56 61, 61 63 C59 68, 61 72, 56 74 L46 74 L47 84 Z" fill="#111318"/>
            <line x1="69" y1="58" x2="78" y2="58" stroke="#111318" stroke-width="4" stroke-linecap="round"/>
            <line x1="68" y1="52" x2="76" y2="47" stroke="#111318" stroke-width="4" stroke-linecap="round"/>
            <line x1="68" y1="64" x2="76" y2="69" stroke="#111318" stroke-width="4" stroke-linecap="round"/>
            <path d="M80 42 A22 22 0 0 1 80 74" stroke="#111318" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path d="M87 36 A30 30 0 0 1 87 80" stroke="#111318" stroke-width="4" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <h1>CarSpeak</h1>
      </div>
      <div class="status-pill"><span class="dot"></span> 5G CarPlay Ready</div>
    </header>

    <!-- Prominent 1-Tap iPhone Ad-Hoc OTA Install Banner -->
    <a href="itms-services://?action=download-manifest&url=https%3A%2F%2Fcarspeak-api.mohalex.workers.dev%2Fmanifest.plist"
       style="display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#4f46e5 0%,#0ea5e9 100%);color:#ffffff;text-decoration:none;font-weight:800;font-size:1.02rem;padding:16px 20px;border-radius:18px;box-shadow:0 10px 24px rgba(14,165,233,0.32);text-align:center;">
      📲 Tap Here to Install CarSpeak App on iPhone (Ad-Hoc Direct)
    </a>

    <!-- Single Clean Dropdown Menu for Previous Antigravity Projects -->
    <section class="dropdown-card">
      <div class="field-group">
        <label class="field-label" for="projectDropdown">Previous Antigravity Projects</label>
        <select id="projectDropdown" onchange="onProjectSelected(this.value)">
          <option value="">General Hands-Free Conversation</option>
        </select>
      </div>

      <div class="field-group" id="savedThreadsGroup" style="display:none;">
        <label class="field-label" for="threadDropdown">Saved Conversations</label>
        <select id="threadDropdown" onchange="onThreadSelected(this.value)">
          <option value="">Current Session</option>
        </select>
      </div>
    </section>

    <!-- Clean Central Voice Orb -->
    <section class="orb-card">
      <div class="voice-orb" id="voiceOrb" onclick="toggleVoice()">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
        <span style="font-size:0.75rem;font-weight:800;margin-top:6px;letter-spacing:0.04em;" id="orbLabel">TAP TO SPEAK</span>
      </div>
      <div>
        <div class="orb-caption" id="statusTitle">Ready for Hands-Free Voice</div>
        <div class="orb-sub" id="statusSub">Select a project from the dropdown or speak to switch anytime</div>
      </div>
      <div class="controls-row">
        <button class="pill-btn btn-coral" onclick="stopSpeech()">Stop Audio</button>
        <button class="pill-btn btn-indigo" onclick="cycleMode()" id="modeBtn">Mode: Executive</button>
        <button class="pill-btn btn-rose" onclick="startFreshThread()">New Thread</button>
      </div>
    </section>

    <!-- Only shown when there is an active conversation turn -->
    <section class="response-card" id="responseCard"></section>

    <form class="composer" onsubmit="handleForm(event)">
      <input type="text" id="textInput" placeholder="Ask anything or say 'Switch to...' " />
      <button type="submit" class="send-btn">Speak</button>
    </form>
  </div>

  <script>
    const modes = ['executive', 'surgical', 'architect', 'memo'];
    const modeLabels = {
      executive: 'Executive',
      surgical: 'Surgical',
      architect: 'Architect',
      memo: 'Roadmap'
    };

    let state = {
      projects: [],
      conversations: [],
      selectedProjectId: '',
      activeConversationId: '',
      persona: 'executive',
      listening: false,
      recognition: null
    };

    async function init() {
      const [projRes, convRes] = await Promise.all([
        fetch('/api/projects').then(r => r.json()),
        fetch('/api/conversations').then(r => r.json())
      ]);
      state.projects = projRes.projects || [];
      state.conversations = convRes.conversations || [];

      const select = document.getElementById('projectDropdown');
      select.innerHTML = `<option value="">General Hands-Free Conversation (${state.projects.length} Projects Available)</option>` +
        state.projects.map(p => `<option value="${p.displayName}">${p.displayName} — ${p.category}</option>`).join('');

      renderSavedThreadsDropdown();
    }

    function renderSavedThreadsDropdown() {
      const group = document.getElementById('savedThreadsGroup');
      const select = document.getElementById('threadDropdown');
      if (!state.conversations || state.conversations.length === 0) {
        group.style.display = 'none';
        return;
      }
      group.style.display = 'flex';
      select.innerHTML = state.conversations.map(c =>
        `<option value="${c.id}" ${c.id === state.activeConversationId ? 'selected' : ''}>${c.title}</option>`
      ).join('');
    }

    async function onProjectSelected(projectName) {
      state.selectedProjectId = projectName;
      if (!projectName) {
        document.getElementById('statusTitle').textContent = 'General Hands-Free Mode';
        document.getElementById('statusSub').textContent = 'Tap the Orb to talk';
        return;
      }
      const proj = state.projects.find(p => p.displayName === projectName);
      document.getElementById('statusTitle').textContent = projectName;
      document.getElementById('statusSub').textContent = proj ? proj.summary : '';
      await sendPrompt(`Let's pick up where we left off on ${projectName}.`);
    }

    async function onThreadSelected(threadId) {
      if (!threadId) return;
      state.activeConversationId = threadId;
      const conv = state.conversations.find(c => c.id === threadId);
      if (conv) {
        document.getElementById('statusTitle').textContent = conv.title;
        renderTurns(conv.turns || []);
      }
    }

    function renderTurns(turns) {
      const card = document.getElementById('responseCard');
      if (!turns || turns.length === 0) {
        card.classList.remove('visible');
        card.innerHTML = '';
        return;
      }
      card.classList.add('visible');
      card.innerHTML = turns.slice(-4).map(t =>
        `<div class="${t.role === 'user' ? 'turn-user' : 'turn-model'}">${t.text}</div>`
      ).join('');
    }

    async function handleForm(e) {
      e.preventDefault();
      const input = document.getElementById('textInput');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      await sendPrompt(val);
    }

    async function sendPrompt(text) {
      document.getElementById('statusSub').textContent = 'Thinking...';
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          persona: state.persona,
          projectId: state.selectedProjectId,
          conversationId: state.activeConversationId
        })
      }).then(r => r.json());

      if (res.activeConversation) {
        state.activeConversationId = res.activeConversation.id;
        const convRes = await fetch('/api/conversations').then(r => r.json());
        state.conversations = convRes.conversations || [];
        renderSavedThreadsDropdown();
        renderTurns(res.activeConversation.turns || []);
        document.getElementById('statusTitle').textContent = res.activeConversation.title;
        document.getElementById('statusSub').textContent = '5G CarPlay Audio Active';
      }

      if (res.reply && window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(res.reply);
        u.rate = 1.04;
        window.speechSynthesis.speak(u);
      }
    }

    function stopSpeech() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function cycleMode() {
      const idx = (modes.indexOf(state.persona) + 1) % modes.length;
      state.persona = modes[idx];
      document.getElementById('modeBtn').textContent = `Mode: ${modeLabels[state.persona]}`;
    }

    async function startFreshThread() {
      state.activeConversationId = '';
      document.getElementById('responseCard').classList.remove('visible');
      document.getElementById('statusTitle').textContent = 'New Conversation Ready';
      document.getElementById('statusSub').textContent = 'Select a project or tap Orb to begin';
    }

    function toggleVoice() {
      const orb = document.getElementById('voiceOrb');
      const label = document.getElementById('orbLabel');
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert('Voice capture supported in Safari/Chrome and the native CarSpeak iOS app.');
        return;
      }
      if (state.listening && state.recognition) {
        state.recognition.stop();
        return;
      }
      const rec = new SpeechRec();
      rec.lang = 'en-US';
      rec.onstart = () => {
        state.listening = true;
        orb.classList.add('listening');
        label.textContent = 'LISTENING...';
      };
      rec.onresult = (ev) => {
        const transcript = ev.results[0][0].transcript;
        sendPrompt(transcript);
      };
      rec.onend = () => {
        state.listening = false;
        orb.classList.remove('listening');
        label.textContent = 'TAP TO SPEAK';
      };
      state.recognition = rec;
      rec.start();
    }

    init();
  </script>
</body>
</html>
